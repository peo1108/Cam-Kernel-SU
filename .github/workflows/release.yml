name: Release
# Cam releases only: tags look like cam-v3.0.1. Upstream KernelSU tags (v*) must never
# publish anything, because every release here is an OTA update for installed Managers.
# cam-v3.1.0-beta.1 publishes a pre-release with 3.1.0's CHANGELOG.md entry: only Managers with
# "Beta updates" on take it.
on:
  push:
    tags:
      - "cam-v*"
  workflow_dispatch:

jobs:
  # Runs first so a tag without a CHANGELOG.md entry stops before the long build.
  changelog:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check tag
        id: version
        run: |
          version="${GITHUB_REF_NAME#cam-v}"
          if [[ "$GITHUB_REF_NAME" =~ ^cam-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            prerelease=false
          elif [[ "$GITHUB_REF_NAME" =~ ^cam-v([0-9]+\.[0-9]+\.[0-9]+)-beta\.[0-9]+$ ]]; then
            prerelease=true
          else
            echo "::error::Run Release from a cam-vX.Y.Z or cam-vX.Y.Z-beta.N tag, not '$GITHUB_REF_NAME'"
            exit 1
          fi
          {
            echo "version=$version"
            echo "notes=${BASH_REMATCH[1]}"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - name: Extract release notes
        run: python3 scripts/changelog_section.py "${{ steps.version.outputs.notes }}" > release-notes.md

      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: release-notes.md

  # Every release is an OTA update pushed to installed Managers: publish only when all tests pass.
  tests:
    needs:
      - changelog
    uses: ./.github/workflows/test.yml

  build-manager:
    needs:
      - changelog
      - tests
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit
  release:
    needs:
      - changelog
      - build-manager
    runs-on: ubuntu-latest
    # Creating the release needs write access; the default token can be read-only on forks.
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Rename camd
        run: |
          mkdir -p camd
          for dir in ./camd-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                camd_platform_name=$(basename "$dir")
                if [ -f "$dir/camd" ]; then
                  mv "$dir/camd" "camd/$camd_platform_name"
                elif [ -f "$dir/camd.exe" ]; then
                  mv "$dir/camd.exe" "camd/$camd_platform_name.exe"
                fi
            fi
          done

      - name: Rename caminit
        run: |
          mkdir -p caminit
          for dir in ./caminit-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                caminit_platform_name=$(basename "$dir")
                if [ -f "$dir/caminit" ]; then
                  mv "$dir/caminit" "caminit/$caminit_platform_name"
                fi
            fi
          done

      - name: Rename lkm
        run: |
          mkdir -p lkm
          for dir in ./*-android*-lkm; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                lkm_platform_name=$(basename "$dir")
                lkm_platform_name="lkm-${lkm_platform_name%-lkm}_camsu.ko"
                KO="$(ls $dir/*_camsu.ko)"
                mv "$KO" "lkm/$lkm_platform_name"
            fi
          done

      - name: Display structure of downloaded files
        run: ls -R

      - name: release
        uses: softprops/action-gh-release@v3
        with:
          name: Cam Kernel SU ${{ needs.changelog.outputs.version }}
          body_path: release-notes/release-notes.md
          prerelease: ${{ needs.changelog.outputs.prerelease == 'true' }}
          files: |
            manager/*.apk
            lkm/lkm-*_camsu.ko
            camd/camd-*
            caminit/*
