name: Build SFS kernel (GKI + KernelSU + SUSFS)
# Builds every GKI release listed in sfs/targets.json with KernelSU built in and
# SUSFS patched in, each packed as an AnyKernel3 zip. Users root with LKM first,
# then the Manager's GKI install page recommends the zip matching their kernel.
# The build itself is sfs/build.sh, the same script local builds run.
on:
  workflow_call:
    inputs:
      filter:
        description: 'Only targets whose tag starts with this (empty = all)'
        required: false
        default: ''
        type: string
      manager:
        description: 'Also build the Manager APK (release.yml builds its own)'
        required: false
        default: false
        type: boolean
  workflow_dispatch:
    inputs:
      filter:
        description: 'Only targets whose tag starts with this, e.g. android16-6.12 (empty = all)'
        required: false
        default: ''
        type: string
  push:
    branches: [ "sfs" ]
    paths:
      - '.github/workflows/build-sfs-kernel.yml'
      - 'kernel/**'
      - 'uapi/**'
      - 'sfs/**'
      - 'manager/**'
      - 'userspace/**'

jobs:
  # The Manager APK, its ksud and every kernel are built from this same commit, so they all
  # carry the same version (30000 + commit count) and the Manager matches the kernels.
  manager:
    # called from Release, which builds its own Manager: skip unless asked
    if: github.workflow != 'Release' || inputs.manager
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit

  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.set.outputs.include }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: sfs/targets.json
      - id: set
        env:
          FILTER: ${{ inputs.filter }}
        run: |
          include=$(jq -c --arg f "$FILTER" \
            '[.targets[] | select(.tag | startswith($f)) | {tag, kernel}]' sfs/targets.json)
          echo "include=$include" >> "$GITHUB_OUTPUT"
          echo "$include" | jq -r '.[] | "\(.kernel)  \(.tag)"'

  build:
    needs: matrix
    name: ${{ matrix.kernel }} (${{ matrix.tag }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          sudo docker image prune --all --force || true
          df -h /

      - name: Checkout KernelSU
        uses: actions/checkout@v7
        with:
          path: KernelSU
          # Full history: the KernelSU version is 30000 + commit count
          fetch-depth: 0

      - name: Install repo
        run: |
          mkdir -p ~/bin
          curl -sSL https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod +x ~/bin/repo
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Build
        env:
          WORK: ${{ github.workspace }}/work
          OUT: ${{ github.workspace }}/out
        run: |
          export KSU_VERSION=$((30000 + $(git -C KernelSU rev-list --count HEAD)))
          bash KernelSU/sfs/build.sh "${{ matrix.tag }}"
          df -h /

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.tag }}
          path: ${{ env.ZIP }}
          compression-level: 0
