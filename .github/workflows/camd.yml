name: Build camd
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      pack_lkm:
        required: false
        type: boolean
        default: false
      pack_caminit:
        required: false
        type: boolean
        default: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download artifacts
      uses: actions/download-artifact@v8
    
    - name: Prepare LKM files
      if: ${{ inputs.pack_lkm }}
      run: |
        cp aarch64-android*-lkm/*_camsu.ko ./userspace/camd/bin/aarch64/
        cp x86_64-android*-lkm/*_camsu.ko ./userspace/camd/bin/x86_64/
    
    - name: Prepare caminit
      if: ${{ inputs.pack_caminit }}
      run: |
        mv caminit-aarch64/caminit ./userspace/camd/bin/aarch64/
        mv caminit-x86_64/caminit ./userspace/camd/bin/x86_64/
        mv caminit-riscv64/caminit ./userspace/camd/bin/riscv64/
        
    - name: Setup rustup
      run: |
        if [ "${{ inputs.target }}" = riscv64-linux-android ]; then
          rustup toolchain install nightly-2026-09-23 --profile minimal --component rust-src
        else
          rustup update stable
          rustup target add ${{ inputs.target }}
        fi

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: userspace/camd
        cache-targets: false

    - uses: nttld/setup-ndk@v1
      id: setup-ndk
      with:
        ndk-version: r29

    - name: Build camd
      env:
        ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          export KSU_PACKAGE_NAME="cam.su.kernel.pr"
        fi
        if [ "${{ inputs.target }}" = riscv64-linux-android ]; then
          source .github/scripts/setup-rust-build.sh riscv64-linux-android 35
          cargo +nightly-2026-09-23 build --config .github/riscv64-cargo.toml -Z build-std=std,panic_abort --target "$TRIPLE" --release --manifest-path ./userspace/camd/Cargo.toml
        else
          source .github/scripts/setup-rust-build.sh ${{ inputs.target }} 26
          cargo build --target "$TRIPLE" --release --manifest-path ./userspace/camd/Cargo.toml
        fi

    - name: Upload camd artifact
      uses: actions/upload-artifact@v7
      with:
        name: camd-${{ inputs.target }}
        path: target/${{ inputs.target }}/release/camd
