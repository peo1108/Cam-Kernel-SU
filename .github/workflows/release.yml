name: Release
on:
  push:
    tags:
      - "v*"
      - "sfs-*"
  workflow_dispatch:

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit
  # GKI + KernelSU + SUSFS AnyKernel3 zips; the Manager's KernelSU GKI card downloads these
  build-sfs-kernel:
    uses: ./.github/workflows/build-sfs-kernel.yml
  release:
    needs:
      - build-manager
      - build-sfs-kernel
    runs-on: ubuntu-latest
    # Creating the release needs write access; the default token can be read-only on forks.
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Rename ksud
        run: |
          mkdir -p ksud
          for dir in ./ksud-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksud_platform_name=$(basename "$dir")
                if [ -f "$dir/ksud" ]; then
                  mv "$dir/ksud" "ksud/$ksud_platform_name"
                elif [ -f "$dir/ksud.exe" ]; then
                  mv "$dir/ksud.exe" "ksud/$ksud_platform_name.exe"
                fi
            fi
          done

      - name: Rename ksuinit
        run: |
          mkdir -p ksuinit
          for dir in ./ksuinit-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                ksuinit_platform_name=$(basename "$dir")
                if [ -f "$dir/ksuinit" ]; then
                  mv "$dir/ksuinit" "ksuinit/$ksuinit_platform_name"
                fi
            fi
          done

      - name: Rename lkm
        run: |
          mkdir -p lkm
          for dir in ./*-android*-lkm; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                lkm_platform_name=$(basename "$dir")
                lkm_platform_name="lkm-${lkm_platform_name%-lkm}_kernelsu.ko"
                KO="$(ls $dir/*_kernelsu.ko)"
                mv "$KO" "lkm/$lkm_platform_name"
            fi
          done

      - name: SFS manifest
        # one entry per kernel zip (build info + sha256); the Manager lists builds from it
        # and checks each download against its sha256
        run: |
          shopt -s nullglob
          infos=(*/KernelSU-SFS-*.zip.json)
          if [ ${#infos[@]} -gt 0 ]; then
            jq -s '{version: .[0].ksuVersion, builds: (sort_by(.file))}' "${infos[@]}" > sfs-manifest.json
            jq -r '.builds[] | "\(.sha256)  \(.file)"' sfs-manifest.json
          fi

      - name: Display structure of downloaded files
        run: ls -R

      - name: release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            manager/*.apk
            lkm/lkm-*_kernelsu.ko
            ksud/ksud-*
            ksuinit/*
            */KernelSU-SFS-*.zip
            sfs-manifest.json
