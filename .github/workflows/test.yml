name: Test

# Unit tests the build workflows do not run: the kernel's seed and Manager pin logic
# (kernel/tests, on the host under ASan/UBSan), camd and caminit on the Linux host, and the Manager's JVM
# tests (among them HidingRulesRepositoryTest, which fails when hiding-rules.json was edited
# without re-signing it), the CHANGELOG.md extractor the Release workflow relies on, and the
# caesarvn.xyz API that sells memberships and serves the OTA feed (site/api).

on:
  push:
    branches: [ "main", "dev" ]
    paths:
      - '.github/workflows/test.yml'
      - 'kernel/policy/**'
      - 'kernel/tests/**'
      - 'userspace/**'
      - 'uapi/**'
      - 'manager/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'CHANGELOG.md'
      - 'scripts/changelog_section.py'
      - 'scripts/test_changelog_section.py'
      - 'site/api/**'
  pull_request:
    branches: [ "main", "dev" ]
    paths:
      - '.github/workflows/test.yml'
      - 'kernel/policy/**'
      - 'kernel/tests/**'
      - 'userspace/**'
      - 'uapi/**'
      - 'manager/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'CHANGELOG.md'
      - 'scripts/changelog_section.py'
      - 'scripts/test_changelog_section.py'
      - 'site/api/**'
  workflow_dispatch:
  # release.yml runs every test before it publishes an OTA update
  workflow_call:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Changelog extractor tests
        run: python3 -m unittest scripts/test_changelog_section.py -v

  # caesarvn.xyz API (site/api): accounts, payments and the SePay webhook, devices, OTA, 2FA.
  site-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: node --test --test-timeout=60000 site/api/test/api.test.mjs site/api/test/business.test.mjs

  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Host tests
        run: make -C kernel/tests

  camd:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup rustup
        run: rustup update stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: userspace/camd

      # embedded_module_uses_release_asset_layout only checks the .ko size when Build Manager
      # has put it in bin/; here it checks the asset name only.
      - name: cargo test
        working-directory: userspace/camd
        run: cargo test --target x86_64-unknown-linux-gnu

      # the library only: the binary is #![no_main] (it runs as /init) and has no tests
      - name: cargo test (caminit)
        working-directory: userspace/caminit
        run: cargo test --target x86_64-unknown-linux-gnu --lib

  manager:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./manager
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: manager-test-reports
          path: manager/app/build/reports/tests/
