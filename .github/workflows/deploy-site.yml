name: Deploy Site

# Cam's own website (site/, https://caesarvn.xyz), served by Caddy on the Cam VPS.
# Not website/: that is still KernelSU's documentation (see deploy-website.yml).
# Besides the pages it publishes everything users download (site/scripts/build-feed.mjs): release
# files under /dl/, the Manager's OTA feed, hiding rules and module library under /feed/. The
# Manager reads only these, so the repository can be private (docs/CAM_CHANGES.md, section 14).
#
# A release or beta needs nothing by hand: Release ends -> this runs -> site, /dl/ and the OTA
# feed have it. workflow_run is required here: a release created with GITHUB_TOKEN (release.yml)
# and a push by GITHUB_TOKEN (module-repo.yml) do not trigger `release` or `push` events.
on:
  workflow_run:
    workflows: [Release, Module Repo]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'CHANGELOG.md'
      - 'manager/app/src/main/assets/hiding-rules.json'
      - 'manager/app/src/main/assets/hiding-rules.json.sig'
      - 'scripts/duck_nightly.sh'
      - '.github/workflows/deploy-site.yml'
  # Releases made by hand in the GitHub UI (with a personal token, not GITHUB_TOKEN).
  release:
    types: [published]
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

jobs:
  deploy:
    # After Release / Module Repo only when they succeeded (a failed release has nothing new).
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./site
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - run: npm ci

      - name: Build
        env:
          # Release data comes from the GitHub API; the token also reads the private repository.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      # Release files (/dl/), the OTA feed, hiding rules and the module library (/feed/).
      - name: Build the feed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run feed

      # The Duck Detector nightly the hiding check page compares the rules with
      # (HidingRulesRepository), picked by scripts/duck_nightly.sh like duck-watch.yml does. Runs
      # daily with the schedule above; `checked` is when GitHub answered. When it gives no usable
      # answer (none, a hang: timeout, or one that fails the check below), the live file is
      # published again as it is, so its `checked` ages until the Manager stops showing it
      # (DUCK_MAX_AGE). When even that copy cannot be read, the upload leaves the live file alone
      # (see below). A Duck lookup never holds back a release: the step cannot fail the job.
      - name: Duck Detector nightly
        continue-on-error: true
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          out=docs/.vitepress/dist/feed/duck-nightly.json
          valid='(.sha | test("^[0-9a-f]{40}$")) and (.date | fromdateiso8601 | . > 0) and (.checked | fromdateiso8601 | . > 0)'
          usable() { [ -s "$out.tmp" ] && jq -e "$valid" "$out.tmp" >/dev/null 2>&1; }
          rm -f "$out" "$out.tmp"
          if read -r sha tag date < <(timeout 90 bash ../scripts/duck_nightly.sh); then
            jq -n --arg sha "$sha" --arg tag "$tag" --arg date "$date" --arg checked "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{sha: $sha, tag: $tag, date: $date, checked: $checked}' > "$out.tmp" || true
          fi
          if ! usable; then
            echo "::warning::GitHub gave no usable Duck Detector nightly; publishing the live duck-nightly.json again"
            rm -f "$out.tmp"
            curl -fsS --max-time 20 -o "$out.tmp" https://caesarvn.xyz/feed/duck-nightly.json || true
          fi
          if usable; then
            mv "$out.tmp" "$out"
            cat "$out"
          else
            rm -f "$out.tmp"
            echo "::warning::no usable duck-nightly.json this run; the live one stays as it is"
          fi

      # The deploy key only runs rrsync, write-only into /var/www/caesarvn (no shell).
      - name: Upload to the VPS
        env:
          SSH_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
          KNOWN_HOSTS: ${{ secrets.SITE_KNOWN_HOSTS }}
          HOST: ${{ secrets.SITE_DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh_cmd="ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          # Two passes so no page ever links to a missing file: new release files and feed first
          # (nothing deleted), then pages; files no longer listed go only after everything is in.
          # A run with no duck-nightly.json (GitHub and the live copy both failed) must not delete
          # the live one: it is still good for up to DUCK_MAX_AGE. Retiring that feed means dropping
          # this filter too.
          keep=()
          [ -f docs/.vitepress/dist/feed/duck-nightly.json ] || keep=(--filter='P /feed/duck-nightly.json')
          rsync -rlz --checksum -e "$ssh_cmd" docs/.vitepress/dist/dl docs/.vitepress/dist/feed "deploy@$HOST:/"
          rsync -rlz --checksum --delete --delete-delay --delay-updates "${keep[@]}" -e "$ssh_cmd" \
            docs/.vitepress/dist/ "deploy@$HOST:/"

      # What the Manager will see: the live feed must list the newest release and its APK must load.
      - name: Check the live feed
        run: |
          built=$(node -e 'console.log(require("./docs/.vitepress/dist/feed/releases.json")[0].tag_name)')
          live=$(curl -fsS https://caesarvn.xyz/feed/releases.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s)[0].tag_name))')
          apk=$(node -e 'const r=require("./docs/.vitepress/dist/feed/releases.json")[0];console.log(r.assets.find(a=>a.name.endsWith(".apk")).browser_download_url)')
          echo "built $built, live $live"
          test "$built" = "$live"
          # With DL_GUARD=1 an anonymous request is refused (401) before the file is read; the files
          # themselves were checked against GitHub's size and digest when the feed was built.
          code=$(curl -sS -r 0-1023 -o /dev/null -w '%{http_code}' "$apk")
          echo "apk: HTTP $code"
          case "$code" in 200|206|401) ;; *) exit 1 ;; esac
          curl -fsS -o /dev/null https://caesarvn.xyz/feed/hiding-rules.json.sig
          curl -fsS -o /dev/null https://caesarvn.xyz/feed/module-repo/modules.json
          echo "### Deployed $built" >> "$GITHUB_STEP_SUMMARY"
