name: Build camd with cross
on:
  workflow_call:
    inputs:
      target:
        required: true
        type: string
      os:
        required: false
        type: string
        default: ubuntu-latest
      pack_lkm:
        required: false
        type: boolean
        default: false
      pack_caminit:
        required: false
        type: boolean
        default: false
jobs:
  build:
    runs-on: ${{ inputs.os }}
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Download artifacts
      uses: actions/download-artifact@v8
    
    - name: Prepare LKM files
      if: ${{ inputs.pack_lkm }}
      run: |
        cp aarch64-android*-lkm/*_kernelsu.ko ./userspace/camd/bin/aarch64/
        cp x86_64-android*-lkm/*_kernelsu.ko ./userspace/camd/bin/x86_64/
    
    - name: Prepare caminit
      if: ${{ inputs.pack_caminit }}
      run: |
        mv caminit-aarch64/caminit ./userspace/camd/bin/aarch64/
        mv caminit-x86_64/caminit ./userspace/camd/bin/x86_64/
        mv caminit-riscv64/caminit ./userspace/camd/bin/riscv64/
        
    - name: Setup rustup
      run: |
        rustup update stable
        if [[ ${{ inputs.target }} == *"-apple-darwin" ]]; then
          rustup target add ${{ inputs.target }}
        fi
    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: userspace/camd
        cache-targets: false
        cache-bin: false

    - name: Install cross
      run: |
        RUSTFLAGS="" cargo install cross --git https://github.com/cross-rs/cross --rev 66845c1

    - name: Assemble LKM bootstrap
      run: |
        clang --target=aarch64-linux-gnu -c -nostdlib \
          -o userspace/camd/.lkm_image_bootstrap.o \
          userspace/camd/src/lkm_image_bootstrap.S

    - name: Build camd
      run: CROSS_NO_WARNINGS=0 cross build --target ${{ inputs.target }} --release --manifest-path ./userspace/camd/Cargo.toml

    - name: Upload camd artifact
      uses: actions/upload-artifact@v7
      with:
        name: camd-${{ inputs.target }}
        path: target/${{ inputs.target }}/release/camd*
