name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build-manager:
    uses: ./.github/workflows/build-manager.yml
    secrets: inherit
  release:
    needs:
      - build-manager
    runs-on: ubuntu-latest
    # Creating the release needs write access; the default token can be read-only on forks.
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Rename camd
        run: |
          mkdir -p camd
          for dir in ./camd-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                camd_platform_name=$(basename "$dir")
                if [ -f "$dir/camd" ]; then
                  mv "$dir/camd" "camd/$camd_platform_name"
                elif [ -f "$dir/camd.exe" ]; then
                  mv "$dir/camd.exe" "camd/$camd_platform_name.exe"
                fi
            fi
          done

      - name: Rename caminit
        run: |
          mkdir -p caminit
          for dir in ./caminit-*; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                caminit_platform_name=$(basename "$dir")
                if [ -f "$dir/caminit" ]; then
                  mv "$dir/caminit" "caminit/$caminit_platform_name"
                fi
            fi
          done

      - name: Rename lkm
        run: |
          mkdir -p lkm
          for dir in ./*-android*-lkm; do
            if [ -d "$dir" ]; then
                echo "----- Rename $dir -----"
                lkm_platform_name=$(basename "$dir")
                lkm_platform_name="lkm-${lkm_platform_name%-lkm}_kernelsu.ko"
                KO="$(ls $dir/*_kernelsu.ko)"
                mv "$KO" "lkm/$lkm_platform_name"
            fi
          done

      - name: Display structure of downloaded files
        run: ls -R

      - name: release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            manager/*.apk
            lkm/lkm-*_kernelsu.ko
            camd/camd-*
            caminit/*
